<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>评估结果</title>
    <script src="/js/tailwindcss.js"></script>
    <link rel="stylesheet" href="/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px;
        }
        .btn-black {
            background-color: #000;
            color: #fff;
            padding: 12px 32px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }
        .btn-black:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-gray-50 to-indigo-50">

    <!-- 顶部导航栏 -->
    <nav class="fixed top-0 w-full bg-white shadow-md px-4 py-4 flex items-center z-50">
        <i class="fas fa-arrow-left text-gray-600 cursor-pointer" onclick="window.history.back()"></i>
        <span class="text-xl font-bold flex-1 text-center">评估结果</span>
        <div class="w-6"></div>
    </nav>

    <!-- 内容区 -->
    <main class="pt-16 pb-8 px-4">

        <!-- 卡片①：结果展示 -->
        <div class="flex flex-col items-center bg-white rounded-lg p-4 shadow-sm mt-6 mx-4">
            <img src="/img/diabetes_show.png" width="40" height="50" alt="糖尿病图标" class="mb-3">
            <span id="resultSpan" class="text-lg text-gray-700 mb-1">正在评估...</span>
            <p id="resultText" class="text-center text-gray-600 text-sm">请稍候</p>
        </div>

        <!-- 卡片②：健康建议 -->
        <div class="flex flex-col bg-white rounded-lg p-4 shadow-sm mt-6 mx-4">
            <h2 class="text-lg font-medium mb-4">健康建议</h2>
            <div id="messageDiv" class="space-y-4 text-gray-700" style="white-space: pre-line;">
                暂无建议
            </div>
        </div>

        <!-- 返回按钮 -->
        <div class="text-center pt-6">
            <button onclick="window.location.replace('/userinfo/userinfo.html')" class="bg-black text-white px-8 py-3 rounded shadow-lg hover:-translate-y-0.5 transition-transform border-none cursor-pointer">
                <i class="fas fa-edit mr-2"></i>返回个人信息
            </button>
        </div>

    </main>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/loading.js"></script>
    <script src="/js/user.js"></script>
    <script src="riskOutcome.js"></script>

</body>
</html>
