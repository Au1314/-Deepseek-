<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>方案定制</title>
  <script src="/js/tailwindcss.js"></script>
  <script src="/js/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="/css/all.min.css">
  <link rel="stylesheet" href="/css/loading.css">
  <link rel="stylesheet" href="getScheme.css">
</head>
<body class="bg-white min-h-screen">
  <!-- 导航栏 -->
  <div class="fixed top-0 left-0 right-0 bg-white shadow-sm z-10">
    <div class="flex items-center justify-between px-4 py-3 max-w-md mx-auto">
      <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 rounded-xl transition-colors">
        <i class="fas fa-arrow-left text-gray-600"></i>
      </button>
      <h1 class="text-lg font-bold">方案定制</h1>
      <span class="w-10"></span>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="pt-16 px-4 pb-8 max-w-md mx-auto w-full">
    <!-- 横幅图 -->
    <img src="/img/getScheme_title.jpg" class="w-full rounded-xl mb-4">

    <!-- 个人信息卡片（只读） -->
    <div class="card space-y-3 mb-4">
      <h2 class="text-lg font-bold mb-3">个人信息</h2>
      <div class="flex justify-between">
        <span class="text-gray-500 text-sm">年龄</span>
        <span id="age" class="text-gray-900 font-medium"></span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 text-sm">性别</span>
        <span id="sex" class="text-gray-900 font-medium"></span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 text-sm">身高</span>
        <span id="height" class="text-gray-900 font-medium"></span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 text-sm">体重</span>
        <span id="weight" class="text-gray-900 font-medium"></span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 text-sm">是否患病</span>
        <span id="disease" class="text-gray-900 font-medium"></span>
      </div>
    </div>

    <!-- 生活习惯卡片 -->
    <div class="card space-y-3 mb-4">
      <h2 class="text-lg font-bold mb-3">生活习惯</h2>

      <!-- 作息时间 -->
      <div class="flex items-center justify-between py-1">
        <span class="text-gray-600 text-sm">作息时间</span>
        <select class="w-36 h-9 px-3 bg-gray-50 rounded-lg text-sm text-center text-gray-700 border border-gray-100 outline-none focus:border-[#4F46E5] transition-colors cursor-pointer">
          <option>请选择</option>
          <option>早睡早起</option>
          <option>晚睡晚起</option>
          <option>早睡晚起</option>
          <option>晚睡早起</option>
        </select>
      </div>

      <!-- 是否经常做饭 -->
      <div class="flex items-center justify-between py-1">
        <span class="text-gray-600 text-sm">是否经常做饭</span>
        <select class="w-36 h-9 px-3 bg-gray-50 rounded-lg text-sm text-center text-gray-700 border border-gray-100 outline-none focus:border-[#4F46E5] transition-colors cursor-pointer">
          <option>请选择</option>
          <option>经常</option>
          <option>偶尔</option>
          <option>很少</option>
        </select>
      </div>

      <!-- 饮食口味 -->
      <div class="flex items-center justify-between py-1">
        <span class="text-gray-600 text-sm">饮食口味</span>
        <select class="w-36 h-9 px-3 bg-gray-50 rounded-lg text-sm text-center text-gray-700 border border-gray-100 outline-none focus:border-[#4F46E5] transition-colors cursor-pointer">
          <option>请选择</option>
          <option>清淡</option>
          <option>适中</option>
          <option>重口味</option>
        </select>
      </div>

      <!-- 运动习惯 -->
      <div class="flex items-center justify-between py-1">
        <span class="text-gray-600 text-sm">运动习惯</span>
        <select class="w-36 h-9 px-3 bg-gray-50 rounded-lg text-sm text-center text-gray-700 border border-gray-100 outline-none focus:border-[#4F46E5] transition-colors cursor-pointer">
          <option>请选择</option>
          <option>经常运动</option>
          <option>偶尔运动</option>
          <option>很少运动</option>
        </select>
      </div>

      <!-- 饮酒习惯 -->
      <div class="flex items-center justify-between py-1">
        <span class="text-gray-600 text-sm">饮酒习惯</span>
        <select class="w-36 h-9 px-3 bg-gray-50 rounded-lg text-sm text-center text-gray-700 border border-gray-100 outline-none focus:border-[#4F46E5] transition-colors cursor-pointer">
          <option>请选择</option>
          <option>从不</option>
          <option>偶尔</option>
          <option>经常</option>
        </select>
      </div>
    </div>

    <!-- 方案建议 -->
    <div class="card mt-4">
      <h2 class="text-lg font-bold mb-3">方案建议</h2>
      <textarea class="w-full h-24 px-4 py-3 bg-gray-50 rounded-xl border-none resize-none text-sm" placeholder="请输入您对生成方案的建议..."></textarea>
    </div>

    <!-- 生成按钮 -->
    <button onclick="getLifeScheme()" class="w-full h-12 bg-[#4F46E5] text-white font-medium rounded-xl mt-6 text-base hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center">
      生成生活方案
    </button>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/user.js"></script>
  <script src="/js/loading.js"></script>
  <script src="getScheme.js"></script>
</body>
</html>
